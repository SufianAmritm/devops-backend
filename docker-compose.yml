services:
  backend:
    image: ghcr.io/${IMAGE_OWNER}/devops-backend:${IMAGE_TAG:-latest}
    env_file: .env
    networks:
      - devops-net
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - devops-net
networks:
  devops-net:
    external: true